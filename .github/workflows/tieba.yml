name: 贴吧签到

on:
  schedule:
    # UTC 22:30 = 北京时间 06:30（GitHub cron 用 UTC，且高峰期可能延迟几十分钟）
    - cron: "30 22 * * *"
  workflow_dispatch: {} # 支持手动触发

permissions:
  actions: write # keepalive 需要

concurrency:
  group: tieba-sign
  cancel-in-progress: false

jobs:
  sign:
    name: 全量签到
    runs-on: ubuntu-latest
    timeout-minutes: 120 # 1000+ 贴吧约需 25~40 分钟，留足余量

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行签到
        env:
          BDUSS: ${{ secrets.BDUSS }}
          STOKEN: ${{ secrets.STOKEN }}
          PUSH_TYPE: ${{ secrets.PUSH_TYPE }}
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
          MAX_FORUMS: ${{ vars.MAX_FORUMS }}
        run: python tieba_sign.py

  keepalive:
    name: 保活（防止 60 天无活动被禁用）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 重新启用定时工作流
        uses: liskin/gh-workflow-keepalive@v1
