name: 贴吧签到

on:
  schedule:
    # GitHub cron 固定 UTC，北京时间 = UTC + 8
    #
    # GitHub 的定时调度是 best-effort：平台高负载时，槽位会被延迟数小时、
    # 甚至直接丢弃且不重试、不通知（官方明确说明 schedule 可能被 drop）。
    # 同账号 wnflb-checkin 实测每天延迟 5~9.5 小时且逐日恶化。
    # 因此这里铺多个时间槽：只要当天有一个槽被成功投递即可。
    # tieba_sign.py 开头有「已签到则早退」预检查，重复触发会在数秒内结束，
    # 不会重复签到、不会互相干扰。
    - cron: "37 22 * * *" # 北京 06:37
    - cron: "37 23 * * *" # 北京 07:37
    - cron: "37 0 * * *"  # 北京 08:37
    - cron: "37 1 * * *"  # 北京 09:37
    - cron: "37 2 * * *"  # 北京 10:37
    - cron: "37 4 * * *"  # 北京 12:37
  workflow_dispatch: {} # 手动触发

permissions:
  actions: write # keepalive 需要

concurrency:
  group: tieba-sign
  cancel-in-progress: false

jobs:
  sign:
    name: 全量签到
    runs-on: ubuntu-latest
    timeout-minutes: 120 # 1000+ 贴吧约需 25~40 分钟，留足余量

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行签到
        env:
          BDUSS: ${{ secrets.BDUSS }}
          STOKEN: ${{ secrets.STOKEN }}
          PUSH_TYPE: ${{ secrets.PUSH_TYPE }}
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
          MAX_FORUMS: ${{ vars.MAX_FORUMS }}
        run: python tieba_sign.py

  keepalive:
    name: 保活（防止 60 天无活动被禁用）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 重新启用定时工作流
        uses: liskin/gh-workflow-keepalive@v1
