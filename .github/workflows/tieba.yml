name: 贴吧签到

on:
  schedule:
    # GitHub cron 固定 UTC，北京时间 = UTC + 8
    # 故意避开整点（整点是 GitHub 调度高峰，容易被丢弃/延迟）
    - cron: "37 22 * * *" # 北京 06:37 主时段
    - cron: "37 23 * * *" # 北京 07:37 兜底（若已签到，脚本 5 秒内自动早退）
    - cron: "37 0 * * *" # 北京 08:37 二次兜底
  workflow_dispatch: {} # 手动触发

permissions:
  actions: write # keepalive 需要

concurrency:
  group: tieba-sign
  cancel-in-progress: false

jobs:
  sign:
    name: 全量签到
    runs-on: ubuntu-latest
    timeout-minutes: 120 # 1000+ 贴吧约需 25~40 分钟，留足余量

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行签到
        env:
          BDUSS: ${{ secrets.BDUSS }}
          STOKEN: ${{ secrets.STOKEN }}
          PUSH_TYPE: ${{ secrets.PUSH_TYPE }}
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
          MAX_FORUMS: ${{ vars.MAX_FORUMS }}
        run: python tieba_sign.py

  keepalive:
    name: 保活（防止 60 天无活动被禁用）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 重新启用定时工作流
        uses: liskin/gh-workflow-keepalive@v1
